name: ci

# The whole project is darwin-only (utun, /dev/bpf, pf, DIOCNATLOOK), so the
# build has to happen on a macOS runner — there is no meaningful cross-check on
# Linux. Tests are written to pass without root and without network access:
# anything privileged skips with a reason, so CI exercises the real suite.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: build & test (macOS, arm64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          check-latest: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l $(git ls-files '*.go'))
          if [ -n "$unformatted" ]; then
            echo "these files are not gofmt-clean:"; echo "$unformatted"; exit 1
          fi

      - name: build
        run: CGO_ENABLED=0 go build ./...

      - name: vet
        run: CGO_ENABLED=0 go vet ./...

      - name: test
        run: CGO_ENABLED=0 go test ./...

      - name: test -race
        run: go test -race ./internal/...

      - name: strategies still compile
        # The acceptance check for the .bat -> TOML conversion: every shipped
        # strategy must load through the real loader with the real lists and
        # fake payloads.
        run: CGO_ENABLED=0 go test ./internal/strategy/ -run TestGeneratedStrategies -v

      - name: binaries link
        run: make build ARCHS=arm64
